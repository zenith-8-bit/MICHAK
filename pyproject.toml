[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-astro-cli"
version = "0.1.0"
description = "A command-line MVP for detecting transient-source candidates in astronomical FITS images."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "astropy>=6.0",
  "photutils>=1.12",
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "typer>=0.12",
  "rich>=13.7",
]

[project.scripts]
nova = "nova.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
